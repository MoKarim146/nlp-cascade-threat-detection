name: Smoke Test and Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        # Installs only what smoke_test.py, collect_results.py, and pytest need.
        # torch/transformers/datasets are optional for these checks and are not
        # installed here to keep CI fast (no GPU or large downloads required).
        run: |
          pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy pytest

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Collect results
        run: python scripts/collect_results.py

      - name: Run tests
        run: pytest -q
